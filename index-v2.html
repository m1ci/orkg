<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ORKG Knowledge Graph Portal</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    .hero {
      background: linear-gradient(135deg, #1d3557, #457b9d);
      color: white;
      padding: 70px 60px;
    }

    .container {
      max-width: 1450px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .tabs {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }

    .tab-button {
      padding: 14px 22px;
      border: none;
      border-radius: 10px;
      background: #dfe7f2;
      cursor: pointer;
    }

    .tab-button.active {
      background: #1d3557;
      color: white;
    }

    .tab-content {
      display: none;
      background: white;
      border-radius: 16px;
      padding: 24px;
    }

    .tab-content.active {
      display: block;
    }
  </style>
</head>

<body>

<!-- ================= HERO ================= -->
<section class="hero">
  <h1>ORKG Knowledge Graph</h1>
  <p id="kgAbstract">Loading...</p>
</section>

<!-- ================= MAIN ================= -->
<div class="container">

  <!-- ================= TABS ================= -->
  <div class="tabs">

    <button class="tab-button active"
            onclick="openTab(event, 'evolutionTab')">
      KG Evolution
    </button>

    <button class="tab-button"
            onclick="openTab(event, 'versionsTab')">
      KG Versions
    </button>

    <button class="tab-button"
            onclick="openTab(event, 'helloTab')">
      Hello Module
    </button>

  </div>

  <!-- ================= TAB: EVOLUTION ================= -->
  <div id="evolutionTab" class="tab-content active">
    <h2>KG Evolution</h2>
    <div id="evolutionModule"></div>
  </div>

  <!-- ================= TAB: VERSIONS ================= -->
  <div id="versionsTab" class="tab-content">
    <h2>KG Versions</h2>
    <div id="versionsModule"></div>
  </div>

  <!-- ================= TAB: HELLO ================= -->
  <div id="helloTab" class="tab-content">
    <h2>Hello World Module</h2>
    <div id="helloModule"></div>
  </div>

</div>

<!-- ================= CORE SCRIPT ================= -->
<script type="module">

  // ---------------------------------------------
  // TAB SYSTEM
  // ---------------------------------------------
  window.openTab = function(evt, tabId) {
    document.querySelectorAll(".tab-content")
      .forEach(t => t.classList.remove("active"));

    document.querySelectorAll(".tab-button")
      .forEach(b => b.classList.remove("active"));

    document.getElementById(tabId).classList.add("active");
    evt.currentTarget.classList.add("active");
  };

  // ---------------------------------------------
  // KG CONTEXT (ONLY DATA SOURCE)
  // ---------------------------------------------
  const context = {
    kgId: "orkg",
    endpoint: "https://moss.dev.dbpedia.link/sparql"
  };

  // ---------------------------------------------
  // LOAD HELLO WORLD MODULE (TEST)
  // ---------------------------------------------
  import helloWorld from "https://m1ci.github.io/kg-modules/kg-hello-world/index.js";

  helloWorld(
    document.getElementById("helloModule"),
    context
  );

  // ---------------------------------------------
  // MODULE LOADER (GENERIC PATTERN)
  // ---------------------------------------------
  async function loadModule(url, el) {
    const mod = await import(url);
    mod.default(el, context);
  }

  // ---------------------------------------------
  // LOAD FUTURE MODULES (PLACEHOLDERS)
  // ---------------------------------------------

  // evolution module (you will replace later)
  loadModule(
    "https://m1ci.github.io/kg-modules/kg-evolution/index.js",
    document.getElementById("evolutionModule")
  );

  // versions module (future)
  loadModule(
    "https://m1ci.github.io/kg-modules/kg-versions/index.js",
    document.getElementById("versionsModule")
  );

</script>

</body>
</html>
